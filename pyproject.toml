[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xflow"
version = "0.1.0"
description = "A Python tool for shut-in wellbore crossflow between isolated reservoirs and OPM Flow benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

